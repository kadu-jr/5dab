name: Build Galaxy Watch8 Classic Wear OS APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-wear-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug and Release Wear OS APKs
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Upload Galaxy Watch8 Classic Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FiveDAb-GalaxyWatch8-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Galaxy Watch8 Classic Release APK
        uses: actions/upload-artifact@v4
        with:
          name: FiveDAb-GalaxyWatch8-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
